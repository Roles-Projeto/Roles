<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busca — Rolês</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/footer.css">
    <link rel="stylesheet" href="/frontend/css/header.css">
    <link rel="stylesheet" href="/frontend/css/style.css">
    <link rel="stylesheet" href="/frontend/css/busca.css">
</head>
<body>

    <div id="header-container"></div>

    <main class="busca-main">

        <!-- CABEÇALHO DA BUSCA -->
        <section class="busca-hero">
            <button class="busca-voltar" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Voltar
            </button>
            <div class="busca-hero-inner container">
                <p class="busca-label">Resultados para</p>
                <h1 class="busca-titulo" id="buscaTitulo">"..."</h1>
                <div class="busca-filtros" id="buscaFiltros">
                    <button class="filtro-btn active" data-tipo="">Tudo</button>
                    <button class="filtro-btn" data-tipo="eventos">
                        <i class="fas fa-calendar-alt"></i> Eventos
                    </button>
                    <button class="filtro-btn" data-tipo="locais">
                        <i class="fas fa-store"></i> Locais
                    </button>
                </div>
            </div>
        </section>

        <!-- RESULTADOS -->
        <section class="busca-resultados container">

            <!-- EVENTOS -->
            <div class="busca-secao" id="secaoEventos">
                <div class="busca-secao-header">
                    <h2><i class="fas fa-calendar-alt"></i> Eventos</h2>
                    <span class="busca-contagem" id="contagemEventos"></span>
                </div>
                <div class="busca-grid" id="gridEventos"></div>
                <div class="busca-ver-mais-wrap" id="verMaisEventosWrap" style="display:none;">
                    <button class="busca-btn-ver-mais" id="verMaisEventos">
                        Ver mais eventos <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
            </div>

            <!-- LOCAIS -->
            <div class="busca-secao" id="secaoLocais">
                <div class="busca-secao-header">
                    <h2><i class="fas fa-store"></i> Locais</h2>
                    <span class="busca-contagem" id="contagemLocais"></span>
                </div>
                <div class="busca-grid" id="gridLocais"></div>
                <div class="busca-ver-mais-wrap" id="verMaisLocaisWrap" style="display:none;">
                    <button class="busca-btn-ver-mais" id="verMaisLocais">
                        Ver mais locais <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
            </div>

            <!-- NENHUM RESULTADO -->
            <div class="busca-vazio" id="buscaVazio" style="display:none;">
                <i class="fas fa-search"></i>
                <h2>Nenhum resultado encontrado</h2>
                <p>Tente buscar por outro nome, categoria ou local.</p>
                <a href="/frontend/index.html" class="btn-ver-todos">Voltar para o início</a>
            </div>

            <!-- LOADING -->
            <div class="busca-loading" id="buscaLoading">
                <div class="busca-spinner"></div>
                <p>Buscando resultados...</p>
            </div>

        </section>

    </main>

    <footer>
        <div id="footer-container"></div>
    </footer>

    <script src="/frontend/js/config.js"></script>
    <script src="/frontend/js/footer.js" defer></script>
    <script src="/frontend/js/loadHeader.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
    (async function () {

        const params = new URLSearchParams(window.location.search);
        const termo  = params.get('q') || '';
        const tipo   = params.get('tipo') || '';

        const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const t    = norm(termo);

        const tituloEl = document.getElementById('buscaTitulo');
        if (tituloEl) tituloEl.textContent = `"${termo}"`;
        document.title = `Busca: ${termo} — Rolês`;

        const filtros = document.querySelectorAll('.filtro-btn');
        filtros.forEach(btn => {
            if (btn.dataset.tipo === tipo) btn.classList.add('active');
            else btn.classList.remove('active');

            btn.addEventListener('click', () => {
                const novoTipo = btn.dataset.tipo;
                const novosParams = new URLSearchParams({ q: termo });
                if (novoTipo) novosParams.set('tipo', novoTipo);
                window.location.href = `/frontend/busca/busca.html?${novosParams.toString()}`;
            });
        });

        const loading       = document.getElementById('buscaLoading');
        const secaoEventos  = document.getElementById('secaoEventos');
        const secaoLocais   = document.getElementById('secaoLocais');
        const gridEventos   = document.getElementById('gridEventos');
        const gridLocais    = document.getElementById('gridLocais');
        const buscaVazio    = document.getElementById('buscaVazio');
        const contagemEv    = document.getElementById('contagemEventos');
        const contagemLoc   = document.getElementById('contagemLocais');

        const POR_PAGINA = 6;
        let paginaEventos = 1;
        let paginaLocais  = 1;
        let todosEventos  = [];
        let todosLocais   = [];

        // -------------------------------------------------------
        // FORMATAR DATA (igual ao Evento.js)
        // -------------------------------------------------------
        function formatarData(dataStr) {
            if (!dataStr) return '-';
            const d     = new Date(dataStr);
            const dias  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
            const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
            return `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]}`;
        }

        // -------------------------------------------------------
        // CRIAR CARD EVENTO — layout completo igual ao Evento.js
        // -------------------------------------------------------
        function criarCardEvento(evento) {
            const dataFormatada = formatarData(evento.data_inicio);
            const hora          = evento.hora_inicio ? evento.hora_inicio.slice(0, 5) : '';
            const isGratuito    = !evento.preco_minimo || parseFloat(evento.preco_minimo) === 0;
            const preco         = isGratuito ? 'Gratuito' : `R$ ${parseFloat(evento.preco_minimo).toFixed(2)}`;

            let imagem = '/frontend/imagens/1º imagem cad.png';
            if (evento.imagem) {
                imagem = evento.imagem.startsWith('http')
                    ? evento.imagem
                    : `${window.API_BASE}${evento.imagem.startsWith('/') ? '' : '/'}${evento.imagem}`;
            }

            const btnAcao = isGratuito
                ? `<a href="/frontend/detalheseventos/presencaconfirmada.html" class="btn-confirmar-busca">
                       <i class="fas fa-check"></i> Confirmar
                   </a>`
                : `<a href="/frontend/detalheseventos/detalheevento.html?id=${evento.id}" class="btn-comprar-busca">
                       <i class="fas fa-ticket-alt"></i> Comprar
                   </a>`;

            const card = document.createElement('article');
            card.className = 'card-evento-busca';
            card.innerHTML = `
                <div class="evento-imagem-wrap">
                    <img src="${imagem}" alt="${evento.nome}"
                         onerror="this.onerror=null;this.src='/frontend/imagens/1º imagem cad.png'">
                    <span class="tag-evento">${evento.assunto || 'Evento'}</span>
                </div>
                <div class="evento-content">
                    <h3>${evento.nome}</h3>
                    <p class="evento-descricao">${evento.descricao || ''}</p>
                    <div class="evento-meta-group">
                        <p class="evento-meta">
                            <i class="fas fa-calendar-alt"></i> ${dataFormatada}
                            ${hora ? `&nbsp;<i class="fas fa-clock"></i> ${hora}` : ''}
                        </p>
                        <p class="evento-meta">
                            <i class="fas fa-map-marker-alt"></i>
                            ${evento.local_nome || ''}${evento.cidade ? ' — ' + evento.cidade : ''}
                        </p>
                        <p class="evento-meta">
                            <i class="fas fa-heart"></i> 0 pessoas interessadas
                        </p>
                    </div>
                    <div class="evento-card-footer">
                        <span class="evento-preco ${isGratuito ? 'gratuito' : ''}">${preco}</span>
                        <div class="evento-acoes">
                            <a href="/frontend/detalheseventos/detalheevento.html?id=${evento.id}" class="btn-detalhes-busca">
                                <i class="fas fa-circle-info"></i> Detalhes
                            </a>
                            ${btnAcao}
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // -------------------------------------------------------
        // CRIAR CARD LOCAL
        // -------------------------------------------------------
        function criarCardLocal(local) {
            let imagem = '/frontend/imagens/1º imagem cad.png';
            if (local.img_capa) {
                imagem = local.img_capa.startsWith('http') || local.img_capa.startsWith('data:')
                    ? local.img_capa
                    : `${window.API_BASE}${local.img_capa.startsWith('/') ? '' : '/'}${local.img_capa}`;
            } else if (local.img_logo) {
                imagem = local.img_logo.startsWith('http') || local.img_logo.startsWith('data:')
                    ? local.img_logo
                    : `${window.API_BASE}${local.img_logo.startsWith('/') ? '' : '/'}${local.img_logo}`;
            }
            const categoria = local.tipo || 'Local';
            const tagClass  = categoria.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, '-').split('-')[0];

            const card = document.createElement('a');
            card.href      = `/frontend/detalheslocais/detalheslocais.html?id=${local.id}`;
            card.className = 'card-local';
            card.innerHTML = `
                <div class="card-image-wrap">
                    <img src="${imagem}" alt="${local.nome}"
                         onerror="this.onerror=null;this.src='/frontend/imagens/1º imagem cad.png'">
                    <span class="tag tag-${tagClass}">${categoria}</span>
                </div>
                <div class="card-content">
                    <h3>${local.nome}</h3>
                    <p class="evento-local">
                        <i class="fas fa-map-marker-alt"></i>
                        ${local.bairro || ''}${local.cidade ? ' — ' + local.cidade : ''}
                    </p>
                </div>
            `;
            return card;
        }

        function renderizarEventos() {
            const slice = todosEventos.slice(0, paginaEventos * POR_PAGINA);
            gridEventos.innerHTML = '';
            slice.forEach(ev => gridEventos.appendChild(criarCardEvento(ev)));
            const verMaisWrap = document.getElementById('verMaisEventosWrap');
            verMaisWrap.style.display = todosEventos.length > slice.length ? 'flex' : 'none';
        }

        function renderizarLocais() {
            const slice = todosLocais.slice(0, paginaLocais * POR_PAGINA);
            gridLocais.innerHTML = '';
            slice.forEach(loc => gridLocais.appendChild(criarCardLocal(loc)));
            const verMaisWrap = document.getElementById('verMaisLocaisWrap');
            verMaisWrap.style.display = todosLocais.length > slice.length ? 'flex' : 'none';
        }

        document.getElementById('verMaisEventos')?.addEventListener('click', () => {
            paginaEventos++;
            renderizarEventos();
        });

        document.getElementById('verMaisLocais')?.addEventListener('click', () => {
            paginaLocais++;
            renderizarLocais();
        });

        try {
            const [resEv, resLoc] = await Promise.all([
                fetch(`${window.API_BASE}/eventos`),
                fetch(`${window.API_BASE}/estabelecimentos`)
            ]);

            const eventos = await resEv.json();
            const locais  = await resLoc.json();

            todosEventos = eventos.filter(e =>
                norm(e.nome).includes(t) ||
                norm(e.assunto || '').includes(t) ||
                norm(e.local_nome || '').includes(t) ||
                norm(e.cidade || '').includes(t)
            );

            todosLocais = locais.filter(l =>
                norm(l.nome).includes(t) ||
                norm(l.tipo || '').includes(t) ||
                norm(l.bairro || '').includes(t) ||
                norm(l.cidade || '').includes(t)
            );

            const mostrarEventos = tipo === '' || tipo === 'eventos';
            const mostrarLocais  = tipo === '' || tipo === 'locais';

            loading.style.display = 'none';

            const temEventos = todosEventos.length > 0 && mostrarEventos;
            const temLocais  = todosLocais.length  > 0 && mostrarLocais;

            if (!temEventos && !temLocais) {
                buscaVazio.style.display   = 'flex';
                secaoEventos.style.display = 'none';
                secaoLocais.style.display  = 'none';
            } else {
                buscaVazio.style.display = 'none';

                if (temEventos) {
                    secaoEventos.style.display = 'block';
                    contagemEv.textContent = `${todosEventos.length} encontrado${todosEventos.length !== 1 ? 's' : ''}`;
                    renderizarEventos();
                } else {
                    secaoEventos.style.display = 'none';
                }

                if (temLocais) {
                    secaoLocais.style.display = 'block';
                    contagemLoc.textContent = `${todosLocais.length} encontrado${todosLocais.length !== 1 ? 's' : ''}`;
                    renderizarLocais();
                } else {
                    secaoLocais.style.display = 'none';
                }
            }

        } catch (err) {
            console.error('Erro na busca:', err);
            loading.style.display = 'none';
            buscaVazio.style.display = 'flex';
        }

    })();
    </script>

</body>
</html>
